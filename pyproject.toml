[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paligemma2-renaissance-experiment"
version = "0.1.0"
description = "Controlled PaliGemma 2 experiments on Renaissance paintings"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "Pillow>=10.3",
]

[project.optional-dependencies]
ml = [
  "accelerate>=1.2",
  "torch>=2.3",
  "transformers>=4.47",
]
test = ["pytest>=8.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
